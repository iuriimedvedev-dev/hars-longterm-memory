apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# OPTIONAL, work profile only: the app terminates TLS itself instead of the
# ingress. Add this component to overlays/work when the pod must be reachable
# directly (NodePort/LoadBalancer, ingress ssl-passthrough, or WireGuard).
#
# Switchable topologies (README, "TLS topologies"):
#   W1 (default) ingress TLS, app plain HTTP  -> do NOT add this component
#   W2           app TLS, ingress passthrough  -> add this component AND
#                                                overlays/work/ingress-passthrough.patch.yaml
#
# Requires Secret hars-memory-mcp-tls of type kubernetes.io/tls with keys
# tls.crt / tls.key.
patches:
  - path: patch-deployment.yaml
