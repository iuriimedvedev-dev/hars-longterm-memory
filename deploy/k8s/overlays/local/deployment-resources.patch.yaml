# Home-sized requests. The index still needs ~2-3 GiB RSS after warm-up, so do
# not go below 2Gi without measuring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hars-memory-mcp
spec:
  template:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
