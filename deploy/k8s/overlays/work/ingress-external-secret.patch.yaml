# Knob 2, TLS variant B (INACTIVE): use a certificate you already have.
#
# Switch to B by editing kustomization.yaml:
#   comment out  - path: ingress-cert-manager.patch.yaml
#   uncomment    - path: ingress-external-secret.patch.yaml
#
# Then create the secret BEFORE applying (the name is set by the JSON6902
# patch in kustomization.yaml):
#   kubectl -n hars-memory create secret tls hars-memory-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# This patch removes the cert-manager annotation so the controller does not
# try to overwrite a manually managed secret. `null` deletes the key in a
# strategic merge patch.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hars-memory-mcp
  annotations:
    cert-manager.io/cluster-issuer: null
