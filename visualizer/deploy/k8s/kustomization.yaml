apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memory-travel

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - trace-server-deployment.yaml

# Common labels applied to all generated resources
commonLabels:
  app.kubernetes.io/part-of: hars-memory
  app.kubernetes.io/managed-by: kustomize
