apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-server
  labels:
    app.kubernetes.io/name: trace-server
    app.kubernetes.io/component: trace-server
    app.kubernetes.io/part-of: hars-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-server
      app.kubernetes.io/component: trace-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-server
        app.kubernetes.io/component: trace-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trace-server
          image: hars-longterm-memory:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - hars_memory.trace
          ports:
            - name: trace
              containerPort: 8098
              protocol: TCP
          env:
            - name: HARS_MEMORY_INDEX_DIR
              value: /data/index
            - name: HARS_MEMORY_TRACE_HTTP_HOST
              value: "0.0.0.0"
            - name: HARS_MEMORY_TRACE_HTTP_PORT
              value: "8098"
            - name: HARS_MEMORY_TRACE_KEEPALIVE_S
              value: "10"
            - name: HARS_MEMORY_TRACE_HITS_CAP
              value: "30"
          volumeMounts:
            - name: index-data
              mountPath: /data/index
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: trace
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: trace
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: hars-memory-index-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: trace-server
  labels:
    app.kubernetes.io/name: trace-server
    app.kubernetes.io/component: trace-server
    app.kubernetes.io/part-of: hars-memory
spec:
  type: ClusterIP
  ports:
    - name: trace
      port: 8098
      targetPort: trace
      protocol: TCP
  selector:
    app.kubernetes.io/name: trace-server
    app.kubernetes.io/component: trace-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hars-memory-index-pvc
  labels:
    app.kubernetes.io/name: trace-server
    app.kubernetes.io/component: trace-server
    app.kubernetes.io/part-of: hars-memory
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
