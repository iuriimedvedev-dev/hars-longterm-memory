- id: q103
  question: 'Почему GKE Service с `type: LoadBalancer` не получает VPN- или офисный контроль доступа?'
  gold_file: kb/k8s/networking/troubleshooting/loadbalancer-service-no-http-access-use-ingress.md
  gold_fact: 'A bare `type: LoadBalancer` Service is meant for raw TCP/non-HTTP traffic (see [Exposing Non-HTTP Services](../readme.md#exposing-non-http-services-tcp)).
    It does not get VPN/office-only access control - that is an Ingress-level concern, not something added to a plain LB Service.'
