apiVersion: v1
kind: ConfigMap
metadata:
  name: hars-memory-config
# Knob: OAuth. Local is permanently unauthenticated.
# The endpoint must not be reachable from an untrusted network in this mode.
data:
  HARS_MEMORY_MCP_OAUTH_ENABLED: "0"
  # Browser MCP clients on the LAN may send any Origin; there is no token to
  # protect, so * is acceptable only on a trusted network.
  HARS_MEMORY_MCP_CORS_ORIGINS: "*"
