- id: q035
  question: 'What does `quotaIncreaseEligibility.isEligible: true` mean, and does it guarantee that Google will increase the
    quota?'
  gold_file: kb/k8s/nodes/troubleshooting/autoscaler-max-size-gcp-quota.md
  gold_fact: '1. **Check whether the family can be expanded at all before requesting.** `quotaIncreaseEligibility.isEligible:
    true` only means the project may ask. Older families (n2d, e2, c3) have finite supply and Google has refused increases
    on them - `N2D_CPUS` 3523 in europe-west1 is a practical hard ceiling[^gcp-quota-thread]. Ask the account team, not the
    API.'
