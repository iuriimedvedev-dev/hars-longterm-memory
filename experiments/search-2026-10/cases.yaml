- id: q090
  question: Какие изменения предлагаются для disk-bound pile-ups, чтобы сократить число одновременно заблокированных syscall?
  gold_file: kb/k8s/nodes/troubleshooting/pod-pid-limit-fork-rejected.md
  gold_fact: '1. Reduce the number of simultaneously blocked syscalls in the workload - this is the only fix that touches
    nothing shared. For disk-bound pile-ups: provisioned IOPS/throughput on the volume instead of default `gp3`, bounded request
    concurrency, and read/write timeouts so a stalled client request stops holding a thread.'
