  gold_fact: "   TOKEN=$(gcloud auth print-access-token)\n   curl -s -H \"Authorization: Bearer $TOKEN\" \\\n     \"https://cloudquotas.googleapis.com/v1/projects/<project>/locations/global/services/compute.googleapis.com/quotaInfos/CPUS-per-project-region\"\
    \n   # dimensionsInfos[region=<region>].details.value, quotaIncreaseEligibility.isEligible"
