apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# OPTIONAL shared embedder: llama.cpp `llama-server` in embedding mode.
#
#   components:
#     - ../../components/embedder
#
# Serving model: embeddinggemma-300M (GGUF, Q8_0), mean pooling, OpenAI-
# compatible `/v1/embeddings` on port 8791. One instance serves many clients;
# `-np` slots are the concurrency limit (see README, "Embedder sizing").
#
# Enabling this component:
#   * creates Deployment/Service/ConfigMap/PVC `embedder*`;
#   * rewrites HARS_MEMORY_EMBED_BASE_URL to http://embedder:8791/v1 and the
#     model name in the app ConfigMap (base keeps the external URL so the
#     component is never required);
#   * expects the GGUF in the `embedder-models` PVC. The init container
#     downloads it when Secret `embedder-model` has key `url`; otherwise seed
#     the PVC yourself (README).
#
# Every `-np`/`-t`/context value is read from `embedder-config`; overlays patch
# that ConfigMap (see overlays/work/embedder-sizing.patch.yaml) rather than
# editing this file.
resources:
  - configmap.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml

patches:
  - path: patch-app-config.yaml
