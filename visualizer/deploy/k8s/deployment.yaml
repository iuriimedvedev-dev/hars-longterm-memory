apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-travel
  labels:
    app.kubernetes.io/name: memory-travel
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: hars-memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-travel
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-travel
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: visualizer
          image: memory-travel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: memory-travel-config
                  key: BACKEND_HOST
                  optional: true
            - name: BACKEND_MEMORY_PORT
              valueFrom:
                configMapKeyRef:
                  name: memory-travel-config
                  key: BACKEND_MEMORY_PORT
                  optional: true
            - name: BACKEND_MEMORY_PATH
              valueFrom:
                configMapKeyRef:
                  name: memory-travel-config
                  key: BACKEND_MEMORY_PATH
                  optional: true
            - name: BACKEND_TRACE_HOST
              valueFrom:
                configMapKeyRef:
                  name: memory-travel-config
                  key: BACKEND_TRACE_HOST
                  optional: true
            - name: BACKEND_TRACE_PORT
              valueFrom:
                configMapKeyRef:
                  name: memory-travel-config
                  key: BACKEND_TRACE_PORT
                  optional: true
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: memory-travel-auth
                  key: AUTH_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
