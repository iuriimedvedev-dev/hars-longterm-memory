apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One-off index restore:
#   kubectl -n hars-memory apply -k deploy/k8s/jobs/restore-index
#
# Uses python:3.13-slim (stdlib only). The snapshot URL comes from Secret
# hars-memory-restore, created with kubectl -- see README, "Restore".
resources:
  - job.yaml
