# Retrieval-metrics gold query set for tools/memory/eval/ab_bench.py.
#
# NOT the same thing as gold_questions.yaml (5 answer-synthesis multi-hop
# questions, graded by keyword-presence in an LLM-generated answer) or
# battle.py's ~100-1000 auto-generated "does this source text turn up
# somewhere in the response" cases. Neither of those can answer "did
# retrieval rank the right DOCUMENT highly" independent of the LLM that
# synthesises the final answer — see the 2026-06-04 eval writeup
# (.session/2026-06-04_graphrag-eval.md), whose only real finding was corpus
# coverage, not retrieval quality, because 8/9 of its "failures" were
# LLM-judge answer-quality scores on questions the corpus (at the time)
# genuinely had zero chunks for.
#
# This file grades RETRIEVAL ONLY: for each question, the gold answer is a
# set of documents (by `file_path`, the identifier LightRAG/BM25/reranker all
# already return per-hit) verified by directly reading the corpus at the
# /mnt/datasets/graphrag/index_gemma_v4 snapshot below. `gold_chunks` records
# the exact chunk `_id` the claim was read from, for human traceability only
# — scoring is doc-level (see ab_bench.py / metrics.py docstrings for why:
# chunk boundaries are a chunking-parameter artifact, robustness to
# re-chunking matters more than chunk-exactness for "did we find the right
# document" grading, which is the question this MCP server's callers
# actually have).
#
# Every gold_docs / superseded_docs entry below was verified by reading the
# actual indexed chunk content (kv_store_text_chunks.json at the snapshot
# below) — none are guessed from filenames.

meta:
  # NOTE: mid-task, this exact directory was renamed to
  # index_gemma_v4.old-usb by a concurrent process outside this task (not
  # caused by this harness — no indexing/extraction was ever run here). File
  # contents are byte-identical (verified: same sizes + mtimes) to the
  # snapshot this query set was built against. HARS_MEMORY_INDEX_DIR is never
  # hardcoded anywhere in this harness — point it at wherever the live index
  # currently lives when re-running. See the eval report for details.
  index_working_dir: /mnt/datasets/graphrag/index_gemma_v4
  index_snapshot_note: >
    Verified 2026-07-29 against kv_store_text_chunks.json mtime 2026-07-12
    11:22, 2048 docs / 6830 chunks (kv_store_full_docs.json / kv_store_text_chunks.json counts).
  corpus_docs: 2048
  corpus_chunks: 6830
  scoring_unit: document (file_path) — see module docstring above
  query_types:
    identifier: "Exact-code/ID lookup (A2S32, phase_c1_lora_safe, hyp:<uuid>, ...)."
    conceptual: "Thematic/summary question, no single verbatim identifier required."
    supersession: >
      Both an outdated and a superseding document match topically; the
      correct answer requires the newer/correcting document. `correct_docs`
      must not be outranked by `superseded_docs` — see metrics.py
      supersession_violated().
    multihop: "Requires synthesizing >=2 distinct documents to fully answer."
    no_answer: >
      No document in this corpus snapshot answers the question (verified
      absent by direct search, not merely 'I didn't happen to notice it').
      gold_docs is intentionally empty; see the no_answer_hit_rate metric.

