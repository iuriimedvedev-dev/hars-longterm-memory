- id: q046
  question: What command can I run in the memcached container to inspect read-buffer and response-object statistics?
  gold_file: kb/monitoring/observability-stack/troubleshooting/memcached-read-buffer-cache-exceeds-container-limit.md
  gold_fact: kubectl --context <cluster> -n monitoring exec memcached-store-0 -c memcached -- bash -c 'exec 3<>/dev/tcp/127.0.0.1/11211;
    printf "stats\r\nstats settings\r\nquit\r\n" >&3; timeout 3 cat <&3' | grep -E "read_buf|response_obj|hash_bytes|maxbytes|read_buf_mem_limit"
  gold_chunk_ids:
  - chunk-dc62e4975f61a0a303345bb628a46da5
  qtype: code
  lang: en
  detected_kind: code_block
  heading_path:
  - memcached working set climbs past `-m` in steps until the container limit (unbounded read/response buffer cache)
