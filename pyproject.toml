[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hars-graphrag"
version = "0.1.0"
description = "Local, model-agnostic GraphRAG service for the HARS/Cortex corpus"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
  # Core GraphRAG engine
  "lightrag-hku>=1.4.16",

  # CPU-only sentence embeddings (e5-large-v2, bge-m3, nomic-embed-text)
  "sentence-transformers>=3.0.0",

  # torch CPU wheel — resolved via the pytorch-cpu named index below
  "torch>=2.0.0",

  # Vector store (LightRAG-native backend)
  "qdrant-client>=1.9.0",

  # Postgres export — async driver (preferred) + sync fallback
  "asyncpg>=0.29.0",

  # Official MCP SDK — used by hars_graphrag_mcp.py
  "mcp>=1.0.0",

  # Config + HTTP
  "pyyaml>=6.0",
  "httpx>=0.27.0",

  # Graph operations (entity search / subgraph in MCP server)
  "networkx>=3.3",

  # HTTP client used by gpu_guard.py
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]

[project.scripts]
graphrag-index = "tools.graphrag.server.index:main"
graphrag-mcp   = "plugins.hars-graphrag.scripts.hars_graphrag_mcp:main"

[tool.hatch.build.targets.wheel]
# This is an application, not a library.  Packages are declared explicitly to
# prevent hatchling from scanning for a matching package name.
packages = ["ingest", "schema", "server"]

# ---------------------------------------------------------------------------
# UV configuration — CPU-only torch via an EXPLICIT named index
# ---------------------------------------------------------------------------

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true          # only used when a package explicitly requests this index

[tool.uv.sources]
# Pin torch to the CPU-only wheel index; no CUDA/ROCm wheels will be fetched.
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Ruff / linting (mirrors repo convention)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
