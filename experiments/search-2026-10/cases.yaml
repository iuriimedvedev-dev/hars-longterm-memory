- id: q100
  question: How can omitting an extension bypass a `match` restriction when a default is configured?
  gold_file: kb/services/codesign/rbac.md
  gold_fact: '**Warning - a `default` outside its own `match` list creates an omit-to-bypass path.** Because step 3 skips
    validation, a caller that omits the extension is signed with the default key even when that key is not in `match`, while
    a caller that passes the same value explicitly is rejected.'
