- id: c47
  question: What are the SRE task workflow stages, and how often is the work planned?
  gold_file: sre-team-collaboration-and-request-guidelines.md
  gold_fact: 'Please keep in mind that our work is planned with 2 weeks sprints.


    When a task is created it follows these steps:


    1. **Open** – The request is received and acknowledged.

    2. **Backlog** - Clarification stage, we need more information about your requirements

    3. **To do** – The task is clear and there is sufficient amount of information for execution

    4. **In Progress** – The request has been assigned to the appropriate engineer.

    5. **Wait** – The task is waiting for a reply

    6. **Review** – Means that the task is undergoing a review by other peers.

    7. **Done** – The request has been fulfilled and all needed actions were performed.'
  gold_heading_path:
  - SRE Team Collaboration and Request Guidelines
  - 3\. Our tasks workflow
