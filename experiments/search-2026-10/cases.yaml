  question: How can a consumer make a skill installation reproducible?
  gold_file: kb/tools/jb-skills/authoring-and-support.md
  gold_fact: The only way to make an install reproducible is a `#ref` in the source naming a tag, release, or commit SHA (`JetBrains/repo/path#v1.2.0`)
    - and `#ref` pinning only works for `owner/repo`-shorthand and GitHub URL sources, not arbitrary git URLs.
