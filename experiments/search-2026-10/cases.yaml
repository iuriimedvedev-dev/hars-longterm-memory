- id: q087
  question: Why can `gpg --import` exit with status 2 on the runner even when the key imports successfully?
  gold_file: kb/services/codesign/troubleshooting/gpg-import-fails-on-arc-runner.md
  gold_fact: '**Cause:** `gpg --import` starts `gpg-agent` as a side effect. The agent cannot start in the runner container,
    and `gpg` then exits `2` despite the successful import - so under `set -e` the step fails for a reason unrelated to the
    signature being checked.'
