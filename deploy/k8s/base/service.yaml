apiVersion: v1
kind: Service
metadata:
  name: hars-memory-mcp
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/instance: hars-memory
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: hars
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/instance: hars-memory
  ports:
    # MCP Streamable HTTP + OAuth discovery/authorize/token endpoints + /healthz
    # all live on this one port.
    - name: mcp
      port: 8099
      targetPort: mcp
      protocol: TCP
    # The unauthenticated trace SSE listener is disabled in configmap.yaml
    # (HARS_MEMORY_TRACE_HTTP_PORT=0). If you enable it, uncomment this port
    # AND keep the Service ClusterIP-only -- never publish it through Ingress.
    # - name: trace
    #   port: 8098
    #   targetPort: 8098
    #   protocol: TCP
