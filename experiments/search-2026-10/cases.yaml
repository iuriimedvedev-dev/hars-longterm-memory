- id: q080
  question: How should CronJobs handle local-time scheduling while avoiding the timezone metrics bug?
  gold_file: kb/monitoring/observability-stack/troubleshooting/ksm-cronjob-timezone-outdated.md
  gold_fact: Do not set `spec.timeZone` on CronJobs - leave it unset so schedules are interpreted in UTC. When wall-clock
    alignment matters (e.g., "run at 09:00 local time"), manually adjust the cron schedule's hour field twice a year at each
    DST transition instead of relying on `spec.timeZone`
