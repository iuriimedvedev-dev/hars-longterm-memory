# Knob 2, topology W2 only (INACTIVE): the app terminates TLS itself.
#
# Use together with `components/app-tls` in kustomization.yaml. ingress-nginx
# passes the TLS stream through without decrypting, so the certificate mounted
# in the pod must be valid for the public host.
#
# Requires ingress-nginx started with --enable-ssl-passthrough (it is off by
# default). If passthrough is not enabled, terminate TLS at the ingress
# (variant A/B) instead -- that is the default W1 topology.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hars-memory-mcp
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  tls:
    # With passthrough the controller does not read this secret; it documents
    # intent only. The pod mounts its own copy as `hars-memory-mcp-tls`.
    - hosts:
        - memory.work.example
      secretName: hars-memory-mcp-tls
