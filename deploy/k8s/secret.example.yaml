# PLACEHOLDERS ONLY -- do not commit real secrets and do not `kubectl apply`
# this file as-is. It exists to document the keys the Deployment expects.
#
# Profiles:
#   LOCAL overlay  -- needs NO Secret at all (OAuth is off, no Ingress).
#   WORK overlay   -- needs hars-memory-oauth (OAuth signing key + approval
#                     token) and the TLS secret, unless cert-manager provides
#                     the latter. Qdrant/restore secrets are optional.
#
# Create the real secret out-of-band (see README.md, "Secrets"):
#
#   openssl genpkey -algorithm ed25519 -out signing.key
#   kubectl -n hars-memory create secret generic hars-memory-oauth \
#     --from-file=signing-key.pem=signing.key \
#     --from-literal=approval-token="$(openssl rand -hex 24)" \
#     --from-literal=authorize-password="$(openssl rand -hex 16)"
#
#   kubectl -n hars-memory create secret generic hars-memory-qdrant \
#     --from-literal=api-key='REPLACE_ME'
#
#   kubectl -n hars-memory create secret tls hars-memory-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# The OAuth server refuses to start unless at least one approval mode is
# configured (approval token OR authorization password). Supplying both is
# supported: the token is for headless clients, the password for a browser.
apiVersion: v1
kind: Secret
metadata:
  name: hars-memory-oauth
  namespace: hars-memory
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: hars
type: Opaque
stringData:
  # Ed25519 (or RSA) private key in PEM. Signs OAuth access tokens.
  # Generate with: openssl genpkey -algorithm ed25519 -out signing.key
  signing-key.pem: |
    -----REPLACE-WITH-REAL-PEM-KEY-----
    REPLACE_ME
    -----END-REPLACE-----
  # Pre-shared secret appended as ?approval_token=... on /authorize.
  approval-token: "REPLACE_ME_32_BYTE_RANDOM_HEX"
  # Browser consent password for the /authorize form (HTTP Basic user is
  # HARS_MEMORY_MCP_OAUTH_AUTHORIZE_USER, default "operator").
  authorize-password: "REPLACE_ME_RANDOM_PASSWORD"
---
# Optional: only needed when HARS_MEMORY_QDRANT_URL requires an API key.
apiVersion: v1
kind: Secret
metadata:
  name: hars-memory-qdrant
  namespace: hars-memory
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/component: qdrant-client
    app.kubernetes.io/part-of: hars
type: Opaque
stringData:
  api-key: "REPLACE_ME_QDRANT_API_KEY"
---
# Optional: only needed for the first-run restore Job
# (jobs/restore-index/job.yaml). Delete the Job afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: hars-memory-restore
  namespace: hars-memory
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/component: restore-job
    app.kubernetes.io/part-of: hars
type: Opaque
stringData:
  # HTTPS URL of a tar.gz snapshot of the LightRAG working directory
  # (graphml + KV + vdb_*.json or the Qdrant-mode index dir).
  snapshot-url: "https://artifacts.example.com/hars/index-snapshot.tar.gz"
  # Optional; when non-empty the Job verifies the download digest.
  snapshot-sha256: ""
---
# TLS certificate for the Ingress. cert-manager creates an equivalent
# kubernetes.io/tls secret automatically -- use ONE of the two, not both.
apiVersion: v1
kind: Secret
metadata:
  name: hars-memory-tls
  namespace: hars-memory
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: hars
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----REPLACE-WITH-REAL-CERTIFICATE-CHAIN-----
  tls.key: |
    -----REPLACE-WITH-REAL-PRIVATE-KEY-----
---
# OPTIONAL: app-terminated TLS (component app-tls, overlay topology W2).
# Only used when the pod itself must serve HTTPS (NodePort/LoadBalancer,
# WireGuard, or ingress ssl-passthrough). Same content as the ingress secret;
# create it with:
#   kubectl -n hars-memory create secret tls hars-memory-mcp-tls \
#     --cert=fullchain.pem --key=privkey.pem
apiVersion: v1
kind: Secret
metadata:
  name: hars-memory-mcp-tls
  namespace: hars-memory
  labels:
    app.kubernetes.io/name: hars-longterm-memory
    app.kubernetes.io/component: app-tls
    app.kubernetes.io/part-of: hars
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----REPLACE-WITH-REAL-CERTIFICATE-CHAIN-----
  tls.key: |
    -----REPLACE-WITH-REAL-PRIVATE-KEY-----
