- id: q104
  question: How does cert-manager write the DNS-01 TXT record when the team's domain delegates the ACME challenge?
  gold_file: kb/k8s/cert-manager/troubleshooting/internal-ingress-custom-domain-cert-fails.md
  gold_fact: 'The `letsencrypt-prod` solver runs `cnameStrategy: Follow`, so cert-manager follows this CNAME and writes the
    TXT at the delegated target where it has write access[^sre-6891].'
