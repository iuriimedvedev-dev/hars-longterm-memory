apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Ingress component: TLS terminates here, the app speaks plain HTTP.
# Included by overlays/work only. The local overlay has NO Ingress.
#
# The host, the TLS secret name and the cert-manager annotation are all
# supplied by the work overlay -- nothing here needs hand-editing.
resources:
  - ingress.yaml
