- id: c02
  question: When manually configuring an S3 bucket policy, which field is edited, what precedence note applies, and what general
    rules and constraints must be followed?
  gold_file: configuring-s3-bucket-policy.md
  gold_fact: 'If you prefer to manage resources manually, you can edit the `spec.bucketPolicy` field in your `S3Bucket` custom
    resource.


    **Note:** When configuring policies, please keep in mind the [Policy Precedence](#policy-precedence). Only the **highest
    priority** section will be applied if multiples are defined.


    ### General Rules and Constraints


    * **No Wildcards:** In OSC-managed S3 buckets, **it is forbidden to use wildcards like `s3:*`**. You must explicitly list
    each allowed action. The controller will reject policies containing any actions not included in the [Allowed S3 Actions](#allowed-s3-actions)
    list.

    * **Public Policies:** While a bucket policy can be public, it may be rejected if a **public block** is enforced at the
    account level. Most production clusters enforce this block for security.

    * **Allowed Actions:** Only specific actions are permitted. See the [full list](#allowed-s3-actions) below.'
  gold_heading_path:
