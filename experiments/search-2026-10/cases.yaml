- id: q037
  question: What commands avoid gpg-agent when downloading the JetBrains keys and verifying the client signature?
  gold_file: kb/services/codesign/troubleshooting/gpg-import-fails-on-arc-runner.md
  gold_fact: 'curl -fsSL -o jb-keys.asc https://download-cdn.jetbrains.com/KEYS

    gpg --no-autostart --batch --dearmor <jb-keys.asc >jb-keys.gpg

    gpgv --keyring ./jb-keys.gpg client.sha256.asc client.sha256'
